[package]
name = "madaha"
version = "0.1.0"
edition = "2024"

[lib]
name = "madaha_core"
path = "src/lib.rs"
crate-type = ["staticlib", "rlib"]

[[bin]]
name = "madaha"
path = "src/main.rs"
required-features = ["desktop-io"]

[dependencies]
alsa = { version = "0.11.0", optional = true }
cpal = { version = "0.18.1", optional = true }
mimalloc = { version = "0.1.52", optional = true }
clap = { version = "4.6.1", features = ["derive", "env"] }
num_enum = "0.7.6"
# opl3-rs 제거됨: 코드베이스 어디에서도 실제로 use되지 않는 죽은 의존성이었고,
# bindgen(libclang 필요)이 걸려 있어 Android 크로스 컴파일을 불필요하게
# 막고 있었다. 나중에 OPL3 플러그인을 실제로 구현할 때 다시 추가할 것.
serde = { version = "1.0.228", features = ["derive"] }
strum = "0.28.0"
strum_macros = "0.28.0"
toml = "1.1.2"
wd_log = "0.4.0"

[dependencies.libmadaha]
path = "libmadaha"

[features]
default = ["desktop-io"]
# alsa(MIDI 입력) + cpal(오디오 출력)은 데스크톱 바이너리 전용.
# Android용 madaha_core staticlib은 --no-default-features로 빌드해서
# 이 세 의존성을 통째로 제외한다 (ffi.rs가 자체 렌더 루프를 돈다).
desktop-io = ["dep:alsa", "dep:cpal", "dep:mimalloc"]

[profile.release]
lto = true
codegen-units = 1
strip = true
# opt-level="z"(크기 최적화)는 원래 데스크톱 CLI 바이너리 용량을 줄이려던
# 설정인데, 실시간 오디오 DSP(리버브/코러스 등 링버퍼 컨볼루션)에는 속도가
# 훨씬 중요하다. 실기기에서 opt-level="z"일 때 소리 끊김+노이즈(버퍼
# 언더런)가 났고, 최고 속도 최적화로 바꾸면 해결되는지 확인 중.
opt-level = 3
